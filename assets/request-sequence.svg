<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img">
  <style>

/* Layout: bright technical sheet. Layer stack, then the request sequence, then contracts and design decisions. Same palette as the Investigator Crew Map. */
svg, :root {
  color-scheme: light;
  --bg: #FFFFFF;
  --panel: #FBFCFE;
  --ink: #0F2138;
  --muted: #5E6E82;
  --line: #D9E1EB;
  --blue: #1D4F91;   --blue-soft: #EAF0F8;
  --amber: #1D4F91;  --amber-soft: #EAF0F8;
  --teal: #1D4F91;   --teal-soft: #EAF0F8;
  --violet: #1D4F91; --violet-soft: #EAF0F8;
  --code-bg: #0F2138; --code-ink: #E3EAF3; --code-dim: #7C8FA8; --code-key: #9DB8DC; --code-str: #E3EAF3;
  --sans: "Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; padding-block: 40px 56px; display: grid; gap: 52px; }
code { font-family: var(--mono); font-size: 0.88em; }
a { color: var(--blue); }
a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

header { display: grid; gap: 8px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
h1 { margin: 0; font-size: clamp(32px, 5.4vw, 48px); font-weight: 800; letter-spacing: -0.025em; line-height: 1.05; text-wrap: balance; }
h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.015em; text-wrap: balance; }
.lede { margin: 0; font-size: 18px; color: var(--muted); max-width: 64ch; }
section { display: grid; gap: 18px; }
.sh { display: grid; gap: 4px; }
.sh p { margin: 0; color: var(--muted); max-width: 72ch; }
.key { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 2px solid; }
.sw.sap { background: var(--blue-soft); border-color: var(--blue); }
.sw.mine { background: #FFFFFF; border-color: var(--ink); }

/* Layer stack */
.stack { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
.layer { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: center; }
.layer:last-child { border-bottom: 0; }
.lname { display: grid; gap: 1px; }
.lname b { font-size: 14.5px; font-weight: 700; }
.lname span { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.items { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
.c { font-family: var(--mono); font-size: 12.5px; padding: 5px 10px; border-radius: 8px; border: 1.5px solid var(--ink); background: #FFFFFF; white-space: nowrap; }
.c.sap { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
.c.amber { border-color: var(--amber); background: var(--amber-soft); }
.c.teal { border-color: var(--teal); background: var(--teal-soft); }
.c.violet { border-color: var(--violet); background: var(--violet-soft); }
.to { color: var(--muted); font-size: 13px; }
.note { font-size: 12.5px; color: var(--muted); }
.down { text-align: center; color: var(--muted); font-size: 12px; font-family: var(--mono); }
@media (max-width: 680px) { .layer { grid-template-columns: 1fr; gap: 8px; } }

/* Sequence */
.diagram { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.diagram svg { display: block; width: 100%; min-width: 980px; height: auto; }
.band { stroke: none; }
.band-a { fill: #F1F5FA; } .band-b { fill: #FFFFFF; }
.bl { fill: var(--muted); font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
.hd-sap { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 1.8; }
.hd-mine { fill: #FFFFFF; stroke: var(--ink); stroke-width: 1.8; }
.hd-amber { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 1.8; }
.hd-teal { fill: var(--teal-soft); stroke: var(--teal); stroke-width: 1.8; }
.hd-violet { fill: var(--violet-soft); stroke: var(--violet); stroke-width: 1.8; }
.ht { fill: var(--ink); font-family: var(--sans); font-size: 14px; font-weight: 700; }
.hs { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; }
.life { stroke: #B7C4D4; stroke-width: 1.2; stroke-dasharray: 4 5; }
.act { fill: #FFFFFF; stroke: var(--ink); stroke-width: 1.2; }
.m { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.r { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-dasharray: 5 4; }
.m-amber { fill: none; stroke: var(--amber); stroke-width: 1.8; } .r-amber { fill: none; stroke: var(--amber); stroke-width: 1.5; stroke-dasharray: 5 4; }
.m-teal { fill: none; stroke: var(--teal); stroke-width: 1.8; } .r-teal { fill: none; stroke: var(--teal); stroke-width: 1.5; stroke-dasharray: 5 4; }
.m-violet { fill: none; stroke: var(--violet); stroke-width: 1.8; } .r-violet { fill: none; stroke: var(--violet); stroke-width: 1.5; stroke-dasharray: 5 4; }
.ah { fill: var(--ink); } .ah-amber { fill: var(--amber); } .ah-teal { fill: var(--teal); } .ah-violet { fill: var(--violet); }
.ml { font-family: var(--mono); font-size: 12px; fill: var(--ink); paint-order: stroke; stroke-width: 6px; stroke-linejoin: round; }
.on-a { stroke: #F1F5FA; } .on-b { stroke: #FFFFFF; }
.ms { font-family: var(--mono); font-size: 10.5px; fill: var(--muted); paint-order: stroke; stroke-width: 6px; stroke-linejoin: round; }
.nb { fill: var(--ink); } .nt { fill: #FFFFFF; font-family: var(--sans); font-size: 10.5px; font-weight: 800; }

/* Contracts */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .cards { grid-template-columns: 1fr; } }
.card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; background: #FFFFFF; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.blue { background: var(--blue); } .dot.amber { background: var(--amber); } .dot.teal { background: var(--teal); } .dot.ink { background: var(--ink); } .dot.violet { background: var(--violet); }
.card-h b { font-size: 14.5px; }
.card-h code { color: var(--muted); font-size: 12px; margin-left: auto; }
pre { margin: 0; padding: 16px; background: var(--code-bg); color: var(--code-ink); font-family: var(--mono); font-size: 12.5px; line-height: 1.6; overflow-x: auto; }
pre .k { color: var(--code-key); } pre .s { color: var(--code-str); } pre .d { color: var(--code-dim); }

/* Decisions */
.decisions { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 960px) { .decisions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .decisions { grid-template-columns: 1fr; } }
.decisions li { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; gap: 8px; align-content: start; background: #FFFFFF; min-width: 0; }
.decisions b { font-size: 15.5px; font-weight: 700; }
.decisions p { margin: 0; color: var(--muted); font-size: 14px; }
.decisions .where { font-family: var(--mono); font-size: 11.5px; color: var(--blue); }

footer { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; color: var(--muted); }

  </style>
  <rect width="100%" height="100%" rx="12" fill="#FBFCFE"/>

      <defs>
        <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
        <marker id="h-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-amber"/></marker>
        <marker id="h-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-teal"/></marker>
        <marker id="h-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah-violet"/></marker>
      </defs>

      <!-- phase bands -->
      <rect x="0" y="92" width="1200" height="116" class="band band-a"/>
      <rect x="0" y="208" width="1200" height="98" class="band band-b"/>
      <rect x="0" y="306" width="1200" height="270" class="band band-a"/>
      <rect x="0" y="576" width="1200" height="144" class="band band-b"/>
      <text x="16" y="112" class="bl">Discover</text>
      <text x="16" y="228" class="bl">Invoke</text>
      <text x="16" y="326" class="bl">Investigate</text>
      <text x="16" y="596" class="bl">Respond</text>

      <!-- headers -->
      <rect x="95" y="18" width="130" height="56" rx="10" class="hd-sap"/>
      <text x="160" y="42" text-anchor="middle" class="ht">SAP Joule</text><text x="160" y="60" text-anchor="middle" class="hs">capability</text>
      <rect x="245" y="18" width="130" height="56" rx="10" class="hd-sap"/>
      <text x="310" y="42" text-anchor="middle" class="ht">Destination</text><text x="310" y="60" text-anchor="middle" class="hs">BTP connectivity</text>
      <rect x="395" y="18" width="130" height="56" rx="10" class="hd-mine"/>
      <text x="460" y="42" text-anchor="middle" class="ht">A2A server</text><text x="460" y="60" text-anchor="middle" class="hs">server.py</text>
      <rect x="555" y="18" width="130" height="56" rx="10" class="hd-mine"/>
      <text x="620" y="42" text-anchor="middle" class="ht">CrewAI crew</text><text x="620" y="60" text-anchor="middle" class="hs">investigator_crew.py</text>
      <rect x="725" y="18" width="130" height="56" rx="10" class="hd-sap"/>
      <text x="790" y="42" text-anchor="middle" class="ht">Gen AI Hub</text><text x="790" y="60" text-anchor="middle" class="hs">LLMs</text>
      <rect x="885" y="18" width="130" height="56" rx="10" class="hd-sap"/>
      <text x="950" y="42" text-anchor="middle" class="ht">SAP-RPT-1</text><text x="950" y="60" text-anchor="middle" class="hs">tabular model</text>
      <rect x="1040" y="18" width="130" height="56" rx="10" class="hd-sap"/>
      <text x="1105" y="42" text-anchor="middle" class="ht">Grounding</text><text x="1105" y="60" text-anchor="middle" class="hs">vector search</text>

      <!-- lifelines -->
      <line x1="160" y1="74" x2="160" y2="706" class="life"/>
      <line x1="310" y1="74" x2="310" y2="706" class="life"/>
      <line x1="460" y1="74" x2="460" y2="706" class="life"/>
      <line x1="620" y1="74" x2="620" y2="706" class="life"/>
      <line x1="790" y1="74" x2="790" y2="706" class="life"/>
      <line x1="950" y1="74" x2="950" y2="706" class="life"/>
      <line x1="1105" y1="74" x2="1105" y2="706" class="life"/>

      <!-- activations -->
      <rect x="455" y="236" width="10" height="400" rx="2" class="act"/>
      <rect x="615" y="290" width="10" height="324" rx="2" class="act"/>

      <!-- 1 resolve -->
      <line x1="160" y1="124" x2="308" y2="124" class="m" marker-end="url(#h)"/>
      <text x="235" y="115" text-anchor="middle" class="ml on-a">resolve alias</text>
      <!-- 2 card -->
      <line x1="160" y1="158" x2="453" y2="158" class="m" marker-end="url(#h)"/>
      <text x="306" y="149" text-anchor="middle" class="ml on-a">GET /.well-known/agent-card.json</text>
      <!-- 3 card back -->
      <line x1="460" y1="190" x2="162" y2="190" class="r" marker-end="url(#h)"/>
      <text x="310" y="182" text-anchor="middle" class="ms on-a">AgentCard · skill "investigate"</text>

      <!-- 4 message/send -->
      <line x1="160" y1="240" x2="453" y2="240" class="m" marker-end="url(#h)"/>
      <text x="306" y="231" text-anchor="middle" class="ml on-b">POST message/send · JSON-RPC</text>
      <!-- 5 working -->
      <path d="M465,252 H500 V268 H467" class="m" marker-end="url(#h)"/>
      <text x="508" y="264" class="ms on-b">status: working</text>
      <!-- 6 kickoff -->
      <line x1="465" y1="298" x2="613" y2="298" class="m" marker-end="url(#h)"/>
      <text x="560" y="290" text-anchor="middle" class="ml on-b">kickoff(inputs)</text>

      <!-- 7 rpt -->
      <line x1="625" y1="340" x2="948" y2="340" class="m" marker-end="url(#h)"/>
      <text x="870" y="331" text-anchor="middle" class="ml on-a">predict(payload)</text>
      <line x1="950" y1="368" x2="627" y2="368" class="r" marker-end="url(#h)"/>
      <text x="870" y="361" text-anchor="middle" class="ms on-a">5 [PREDICT] cells filled</text>
      <!-- 8 grounding -->
      <line x1="625" y1="414" x2="1103" y2="414" class="m" marker-end="url(#h)"/>
      <text x="1028" y="405" text-anchor="middle" class="ml on-a">search(query) × 3</text>
      <line x1="1105" y1="442" x2="627" y2="442" class="r" marker-end="url(#h)"/>
      <text x="1028" y="435" text-anchor="middle" class="ms on-a">top 5 chunks each</text>
      <!-- 9 llm -->
      <line x1="625" y1="490" x2="788" y2="490" class="m" marker-end="url(#h)"/>
      <text x="706" y="481" text-anchor="middle" class="ml on-a">completion</text>
      <line x1="790" y1="518" x2="627" y2="518" class="r" marker-end="url(#h)"/>
      <text x="706" y="511" text-anchor="middle" class="ms on-a">verdict text</text>
      <text x="800" y="545" class="ms on-a">LiteLLM calls happen at every agent step</text>
      <text x="800" y="560" class="ms on-a">flash-lite for tool users, gpt-4o for the detective</text>

      <!-- 10 crew output -->
      <line x1="620" y1="610" x2="467" y2="610" class="r" marker-end="url(#h)"/>
      <text x="540" y="602" text-anchor="middle" class="ms on-b">CrewOutput</text>
      <!-- 11 completed -->
      <line x1="460" y1="632" x2="162" y2="632" class="r" marker-end="url(#h)"/>
      <text x="310" y="624" text-anchor="middle" class="ml on-b">artifact investigation_result · completed</text>
      <!-- 12 render -->
      <path d="M160,660 H195 V680 H162" class="m" marker-end="url(#h)"/>
      <text x="203" y="675" class="ms on-b">render artifacts[0] as markdown</text>
    
</svg>
