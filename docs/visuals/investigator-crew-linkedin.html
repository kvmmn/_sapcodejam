<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 1080x1350 (4:5) frame on a 72px margin. Header, diagram, timeline, colophon in the bottom-right corner.
   Monochrome: graphite ink, warm-neutral greys; SAP services as filled grey tiles, my code as outlined white tiles. */
:root {
  color-scheme: light;
  --page: #ECECEA;
  --bg: #FFFFFF;
  --ink: #151515;
  --ink2: #474747;
  --muted: #727272;
  --line: #E3E3E1;
  --zone: #F8F8F7;
  --tile: #EEEEEC;
  --sap: #0070F2;
  --sap-soft: #EBF4FF;
  --sans: "Plus Jakarta Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
body { background: var(--page); color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; padding-block: 32px; }
.frame { display: block; width: 100%; height: auto; background: var(--bg); border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 30px rgba(0,0,0,.07); }
html.export body { background: var(--bg); }
html.export .wrap { max-width: none; padding: 0; }
html.export .frame { border-radius: 0; box-shadow: none; width: 1080px; }

/* header */
.eyebrow { fill: var(--muted); font-family: var(--mono); font-size: 15px; letter-spacing: 0.16em; }
.h1 { fill: var(--ink); font-family: var(--sans); font-size: 58px; font-weight: 800; letter-spacing: -1.8px; }
.h2 { fill: var(--sap); font-family: var(--sans); font-size: 30px; font-weight: 500; letter-spacing: -0.4px; }
.lab { fill: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em; }
.proj { fill: var(--ink); font-family: var(--sans); font-size: 17px; font-weight: 700; }
.proj-s { fill: var(--muted); font-family: var(--sans); font-size: 17px; }

/* diagram */
.zone { fill: var(--zone); stroke: var(--line); stroke-width: 1.2; }
.zl { fill: var(--ink2); font-family: var(--sans); font-size: 14px; font-weight: 700; letter-spacing: 0.14em; }
.zr { fill: var(--muted); font-family: var(--mono); font-size: 14px; }
.mine { fill: #FFFFFF; stroke: var(--ink); stroke-width: 1.6; }
.sap { fill: var(--sap-soft); stroke: none; }
.t, .t-sap { fill: var(--ink); font-family: var(--sans); font-size: 24px; font-weight: 700; letter-spacing: -0.3px; }
.t-sap { fill: var(--sap); }
.d { fill: var(--muted); font-family: var(--sans); font-size: 17px; }
.m { fill: var(--muted); font-family: var(--mono); font-size: 14px; }
.m-sap { fill: var(--ink2); font-family: var(--mono); font-size: 14px; }
.edge { fill: none; stroke: var(--ink); stroke-width: 1.6; }
.edge-soft { fill: none; stroke: var(--muted); stroke-width: 1.4; }
.ah { fill: var(--ink); } .ah-soft { fill: var(--muted); }
.el { fill: var(--ink); font-family: var(--mono); font-size: 14.5px; font-weight: 500; }
.el-s { fill: var(--muted); font-family: var(--mono); font-size: 13px; }
.halo-w { paint-order: stroke; stroke: #FFFFFF; stroke-width: 7px; stroke-linejoin: round; }
.person { fill: var(--ink); }
.badge-i { fill: var(--ink); } .badge-b { fill: var(--sap); }

/* icons */
.ic { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic-w { stroke: #FFFFFF; } .ic-m { stroke: var(--muted); } .ic-i { stroke: var(--ink); } .ic-b, .ic-sap { stroke: var(--sap); }

/* timeline */
.track { stroke: var(--line); stroke-width: 1.5; }
.node { fill: #FFFFFF; stroke: var(--ink); stroke-width: 1.5; }
.node-sap { fill: var(--sap-soft); stroke: var(--sap); stroke-width: 1.5; }
.zl-sap { fill: var(--sap); font-family: var(--sans); font-size: 14px; font-weight: 700; letter-spacing: 0.14em; }
.st { fill: var(--ink); font-family: var(--sans); font-size: 15.5px; font-weight: 600; }

/* colophon */
.rule { stroke: var(--line); stroke-width: 1.2; }
.name { fill: var(--ink); font-family: var(--sans); font-size: 18px; font-weight: 700; }
.logo-i { fill: var(--ink); } .logo-sap { fill: var(--sap); }
.lg-t { fill: var(--ink); font-family: var(--sans); font-size: 13px; font-weight: 600; }
.lg-tb { fill: var(--sap); font-family: var(--sans); font-size: 14px; font-weight: 800; }
.lg-s { fill: var(--muted); font-family: var(--sans); font-size: 12.5px; }
.lg-lab { fill: var(--muted); font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.16em; }
.lg-div { stroke: var(--line); stroke-width: 1.2; }
</style>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const RIGHT = 1008;
  const root = document.getElementById('credits');
  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    (parent || root).appendChild(n);
    return n;
  }
  function text(parent, x, y, cls, str) { const t = el('text', { x, y, class: cls }, parent); t.textContent = str; return t; }
  function mark(parent, logo, lw, lh, name, nameCls, logoCls) {
    const g = el('g', {}, parent);
    let w = 0;
    if (logo) { el('use', { href: '#' + logo, x: 0, y: -lh / 2, width: lw, height: lh, class: logoCls || 'logo-i' }, g); w = lw + 7; }
    if (name) { const t = text(g, w, 0, nameCls || 'lg-t', name); t.setAttribute('dominant-baseline', 'central'); w += t.getComputedTextLength(); }
    return { g, w };
  }
  function divider(parent) { const g = el('g', {}, parent); el('line', { x1: 0, y1: -9, x2: 0, y2: 9, class: 'lg-div' }, g); return { g, w: 1 }; }
  function line(parts, cy, gap) {
    let x = RIGHT;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      x -= p.w;
      p.g.setAttribute('transform', `translate(${x} ${cy})`);
      x -= (p.gap != null ? p.gap : gap);
    }
  }
  function layout() {
    root.textContent = '';
    const r1 = el('g', {});
    const sap = mark(r1, 'l-sap', 40, 20, 'CodeJam', 'lg-tb', 'logo-sap');
    const d1 = divider(r1);
    const host = mark(r1, null, 0, 0, 'hosted at', 'lg-s');
    const zal = mark(r1, 'l-zalando', 16, 16, 'Zalando');
    host.gap = 8;
    line([sap, d1, host, zal], 1262, 14);

    const r2 = el('g', {});
    line([
      mark(r2, null, 0, 0, 'BUILT WITH', 'lg-lab'),
      mark(r2, 'l-python', 16, 16, 'Python'),
      mark(r2, 'l-crewai', 16, 16, 'CrewAI'),
      mark(r2, null, 0, 0, 'LiteLLM'),
      mark(r2, 'l-cf', 17, 17, 'Cloud Foundry'),
      mark(r2, 'l-gemini', 15, 15, 'Gemini'),
      mark(r2, 'l-openai', 15, 15, 'OpenAI')
    ], 1294, 16);
  }
  layout();
  if (document.fonts) {
    Promise.all([
      document.fonts.load('600 13px "Plus Jakarta Sans"'),
      document.fonts.load('800 14px "Plus Jakarta Sans"'),
      document.fonts.load('400 10.5px "JetBrains Mono"')
    ]).then(() => document.fonts.ready).then(layout, layout);
  }
})();
</script>
